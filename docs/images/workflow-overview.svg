<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="title desc">
<title id="title">CartWeave — from discovery to verified publication</title><desc id="desc">Conceptual diagram: discover products, verify supply, rank and price, review content, prepare and publish, confirm buyability. AI maps interfaces; verified code executes business.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#1d2b32"/></linearGradient><linearGradient id="beam"><stop stop-color="#5be2ba" stop-opacity=".1"/><stop offset=".65" stop-color="#5be2ba"/><stop offset="1" stop-color="#afebff"/></linearGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".08"/></pattern></defs>
<rect width="1280" height="570" rx="28" fill="url(#bg)"/><rect width="1280" height="570" rx="28" fill="url(#grid)"/>
<g font-family="system-ui,-apple-system,Arial,sans-serif"><text x="64" y="69" fill="#62e3bb" font-size="15" letter-spacing="4">CARTWEAVE / COMMERCE WORKFLOWS</text><text x="64" y="128" fill="#fff" font-size="39" font-weight="700">Discover. Verify. Publish.</text><text x="64" y="164" fill="#a8bac4" font-size="18">AI for adaptation. Deterministic rules for execution.</text>
