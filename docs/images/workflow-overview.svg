<g font-size="12" fill="#62e3bb" letter-spacing="2"><text x="84" y="259">01 / DISCOVER</text><text x="300" y="259">02 / VERIFY</text><text x="516" y="259">03 / RANK</text><text x="732" y="259">04 / PREPARE</text><text x="948" y="259">05 / PUBLISH + CONFIRM</text></g>
<g fill="#f5f9fc" font-size="21" font-weight="600"><text x="84" y="299">CJ catalog</text><text x="300" y="299">Supply facts</text><text x="516" y="299">Price + score</text><text x="732" y="299">Valid payload</text><text x="948" y="299">Verified storefront</text></g>
